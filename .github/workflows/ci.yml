name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android Bazel
            os: ubuntu-24.04
            tasks: ""
          - name: iOS, lint and resource parity
            os: macos-15
            tasks: lintKotlin :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode for Compose UIKit linking
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '23'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools cmdline-tools;23.0'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 37.0
        run: '"$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Install Android NDK
        if: runner.os == 'Linux'
        run: '"$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" "ndk;27.1.12297006"'
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        if: runner.os == 'Linux'
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name == 'push' }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        if: runner.os == 'macOS'
      - name: Prepare build configuration without service credentials
        run: touch local.properties
      - name: Check dependency declarations
        run: python3 tools/check_versions.py
      - name: Build and test Android with Bazel
        if: runner.os == 'Linux'
        run: |
          bazel build //androidApp:app //androidApp:app_release --jobs=2 --repo_env=ANDROID_HOME="$ANDROID_HOME" --repo_env=ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          bazel test //feature/tasks:all --jobs=2 --repo_env=ANDROID_HOME="$ANDROID_HOME" --repo_env=ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
      - name: Build and test iOS, and lint Kotlin
        if: runner.os == 'macOS'
        env:
          GRADLE_TASKS: ${{ matrix.tasks }}
        shell: bash
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" \
            --no-daemon --no-configuration-cache --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' \
            -Pkotlin.daemon.jvmargs=-Xmx1g \
            --stacktrace
      - name: Compare Compose resources with Gradle outputs
        if: runner.os == 'macOS'
        run: python3 tools/compose_resources/check_parity.py
